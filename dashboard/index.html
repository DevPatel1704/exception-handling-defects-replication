<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExceptionLab</title>
<meta name="description" content="Replication and extension of de Pádua & Shang (MSR 2018): exception handling practices and post-release defects.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366F1'/%3E%3Cpath d='M10 11c-2 0-3 1-3 3v1c0 1-1 1.5-2 1.5 1 0 2 .5 2 1.5v1c0 2 1 3 3 3M22 11c2 0 3 1 3 3v1c0 1 1 1.5 2 1.5-1 0-2 .5-2 1.5v1c0 2-1 3-3 3' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16.5' r='2' fill='white'/%3E%3C/svg%3E">
<script>
  // theme before first paint: saved choice, else the OS preference
  (function () { var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 2.5-2 3 1 .5 2 1.5 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.5 1 2.5 2 3-1 .5-2 1.5-2 3v2c0 2-1 3-3 3"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></div>
      <div class="brand-text"><div class="brand-name">ExceptionLab</div><div class="brand-sub">Software Quality Research</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-status"><div class="nav-label label" style="padding:0 0 2px">System status</div><ul id="sideStatus"><li><span class="dot"></span><span>Checking…</span></li></ul></div>
    <div class="side-foot"><button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar"><span class="cb-ic"></span><span>Collapse</span></button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <span id="globalStatus"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
      <div class="avatar" title="Local user" aria-label="Local user">U</div>
    </header>

    <main class="content" id="content">
      <div id="noServer" class="banner bad hidden" role="alert" style="margin-bottom:16px"></div>
      <section id="researchHead" class="card hidden" style="margin-bottom:18px"></section>
      <section data-view="overview" class="hidden"></section>
      <section data-view="analyze" class="hidden"></section>
      <section data-view="jobs" class="hidden"></section>
      <section data-view="results" class="hidden"></section>
      <section data-view="original" class="hidden"></section>
      <section data-view="downloads" class="hidden"></section>
    </main>
  </div>
</div>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
